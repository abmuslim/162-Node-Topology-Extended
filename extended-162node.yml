        - /dev:/dev
        - /home/user/topology/162-Node-Topology-Extended/k3s_images:/var/lib/rancher/k3s/agent/images:ro

      cmd: >
          bash -c '
            rm -rf /run/k3s /var/lib/rancher/k3s/server 2>/dev/null || true
            sleep $((RANDOM % 120))
            echo "[INIT] Preparing system..."
            ulimit -n 65536
            sysctl -w fs.inotify.max_user_instances=4096
            sysctl -w fs.inotify.max_user_watches=524288
            sysctl -w fs.file-max=2097152

            # Disable PSI reporting to avoid issues with cgroup enforcement
            echo 0 > /sys/fs/cgroup/cpu.pressure || true
            echo 0 > /sys/fs/cgroup/memory.pressure || true

            # Wait for eth1 to appear
            echo "[NET] Waiting for eth1 to be created..."
            until ip link show eth1 >/dev/null 2>&1; do
                sleep 1
            done
            echo "[NET] eth1 detected."

            # Set up network
            ip link set eth1 up
            # ip addr add 10.1.0.1/24 dev eth1
            ip link set eth1 mtu 1400

            # Small randomized delay
            NODE_NUM=$(hostname | grep -o '[0-9]*$')
            BATCH=$(( (NODE_NUM - 1) / 5 ))
            sleep $(( BATCH * 60 + 60 + RANDOM % 20 ))

            # Start K3s (with cgroup enforcement disabled)
            echo "[INIT] Launching optimized K3s server with relaxed cgroups..."
            k3s server \
              --node-name serf44 \
              --disable traefik \
              --disable servicelb \
              --disable local-storage \
              --disable metrics-server \
              --disable-cloud-controller \
              --disable-network-policy \
              --disable-helm-controller \
              --snapshotter native \
              --tls-san 10.0.16.11 \
              --kubelet-arg=cgroup-root=/ \
              --kubelet-arg=cgroups-per-qos=false \
              --kubelet-arg=enforce-node-allocatable= \
              --kubelet-arg=runtime-request-timeout=10m \
              --v=0 &

            until [ -f /etc/rancher/k3s/k3s.yaml ]; do sleep 2; done
            chmod 666 /etc/rancher/k3s/k3s.yaml
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            echo "[INIT] Waiting for containerd to be ready..."
            until /usr/local/bin/k3s ctr version >/dev/null 2>&1; do
                echo "  containerd not yet ready, retrying..."
                sleep 3
            done
            echo "Containerd is ready."

            echo "[INIT] Importing cached images..."
            for f in /var/lib/rancher/k3s/agent/images/*.tar; do
                echo "Loading $f ..."
                /usr/local/bin/k3s ctr images import "$f" || true
            done

            until kubectl get nodes 2>/dev/null | grep -q Ready; do sleep 5; done
            sleep $(( (NODE_NUM - 1) * 3 + 10 ))
            k3s kubectl create secret docker-registry regcred --docker-server=docker.io --docker-username=dummy --docker-password=dummy -n default || true
            k3s kubectl apply -f /tmp/namespace.yaml
            k3s kubectl apply -f /tmp/rbac.yaml
            k3s kubectl apply -f /tmp/deployment.yaml
            k3s kubectl apply -f /tmp/ram_price.yaml
            k3s kubectl apply -f /tmp/storage_price.yaml
            k3s kubectl apply -f /tmp/vcpu_price.yaml
            k3s kubectl apply -f /tmp/vgpu_price.yaml
            k3s kubectl apply -f /tmp/ksense-resource-offer-deployment.yaml

 

            mkdir -p ~/.kube
            cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
            chown $(whoami):$(whoami) ~/.kube/config
            chmod 600 ~/.kube/config

            echo "[READY] K3s cluster is up and running on $(hostname)."

            pip install kubernetes || true
            # Install KWOK
            echo "[KWOK] Installing KWOK controller..."
            k3s kubectl apply -f https://github.com/kubernetes-sigs/kwok/releases/download/v0.7.0/kwok.yaml
            
            echo "[KWOK] Waiting for KWOK controller to be ready..."
            k3s kubectl -n kube-system rollout status deploy/kwok-controller --timeout=300s || true
            
            echo "[KWOK] Applying stage-fast configuration..."
            k3s kubectl apply -f https://github.com/kubernetes-sigs/kwok/releases/download/v0.7.0/stage-fast.yaml
            
            echo "[KWOK] Applying metrics-usage configuration..."
            k3s kubectl apply -f https://github.com/kubernetes-sigs/kwok/releases/download/v0.7.0/metrics-usage.yaml
            
            echo "[KWOK] Installation complete!"
            
            while true; do
                sync
                echo 3 > /proc/sys/vm/drop_caches
                sleep 100000
            done &

            sleep infinity
          '

